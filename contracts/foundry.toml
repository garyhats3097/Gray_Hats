[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# The deploy script writes contract addresses for the frontend.
fs_permissions = [{ access = "read-write", path = "../frontend/src/config" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false
